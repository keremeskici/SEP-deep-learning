# sweep.yaml defines which hyperparameters can vary and how
# right now the following parameters are variable:
# learning rate from optimizer, batch size, training epochs
# you can enable more if you like

program: scripts/train.py
method: bayes

metric:
  name: val_macro_f1
  goal: maximize

parameters:
  lr:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.01

  batch_size:
    values: [32, 64, 128]

  epochs:
    values: [20, 30, 50]

command:
  - ${env}
  - python
  - scripts/train.py
  - --config
  - configs/default_config.yaml
  - --lr
  - ${lr}
  - --batch_size
  - ${batch_size}
  - --epochs
  - ${epochs}